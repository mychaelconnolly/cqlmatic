name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: ./dev fetch --locked
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Run every check
        # The Windows job lints the Windows build on Windows itself.
        run: python3 tools/local_checks.py --no-windows-lint --out "$RUNNER_TEMP/checks"
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Retain LF checkout
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and build native Windows release
        env:
          CARGO_HOME: ${{ runner.temp }}/cqlmatic-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/cqlmatic-target
        run: ./tools/windows-release.ps1 -OutDir "${{ runner.temp }}/windows-artifact"
      - name: Upload checked Windows executable
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/windows-artifact/cqlmatic.exe
            ${{ runner.temp }}/windows-artifact/BUILD-WINDOWS.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install locked site dependencies
        run: npm --prefix site ci
      - name: Test site
        run: npm --prefix site test
      - name: Build site from this commit
        run: npm --prefix site run build -- --commit "$GITHUB_SHA"
      - name: Stage immutable site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/site-artifact/site"
          cp -a site/dist "$RUNNER_TEMP/site-artifact/site/dist"
      - name: Upload checked site output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: ${{ runner.temp }}/site-artifact/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 30
